name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Mirrors Vercel's install command
      - name: Install
        run: npm install --force

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
